command:
  - "streamlit"
  - "run"
  - "app.py"

env:
  # Caminho do Volume do Unity Catalog onde os dossies e PDFs ficam salvos.
  - name: "SENTINELA_DATA_DIR"
    value: "/Volumes/main/sentinela/dossies"

  # --- Configuracao da IA (opcional) -------------------------------------
  # Necessaria apenas para o preenchimento automatico. Remova os blocos
  # abaixo se nao for usar essa funcionalidade.

  # Credencial: key da Anthropic (sk-ant-...) OU key do proxy LiteLLM.
  - name: "ANTHROPIC_API_KEY"
    valueFrom: "anthropic-api-key"

  # Endereco do servico: gateway LiteLLM do Nubank (conforme o manual, secao 13).
  # REMOVA esta linha se for usar a API da Anthropic direta.
  - name: "ANTHROPIC_BASE_URL"
    value: "https://litellm.data.nubank.world"

  # Nome do modelo no gateway (no proxy costuma ter o prefixo do provedor).
  - name: "SENTINELA_LLM_MODELO"
    value: "anthropic/claude-sonnet-4-6"

  # Formato da rota: "openai" (/v1/chat/completions) ou "anthropic"
  # (/v1/messages). Se omitido, o app escolhe automaticamente.
  # - name: "SENTINELA_LLM_FORMATO"
  #   value: "openai"

  # --- Base de casos para consulta (opcional) -----------------------------
  # Ao GERAR um dossie, ele tambem e gravado nas tabelas de usr.sentinela_aml
  # (so o dossie: Resolucao e Avaliacao nao sao gravadas). Ative informando o
  # SQL warehouse; sem esta variavel, o app funciona como antes (so arquivos).
  # Se usar um recurso "SQL warehouse" do Databricks App, prefira valueFrom.
  # - name: "SENTINELA_SQL_WAREHOUSE_ID"
  #   value: "<id do SQL warehouse>"
  # Catalogo/schema (padrao: usr / sentinela_aml):
  # - name: "SENTINELA_SQL_CATALOGO"
  #   value: "usr"
  # - name: "SENTINELA_SQL_SCHEMA"
  #   value: "sentinela_aml"
